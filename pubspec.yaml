name: memora
description: "Smart Flashcards Learning App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.2

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.1.1
  google_fonts: ^6.3.2
  cloud_firestore: ^6.0.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flip_card: ^0.7.0

  fl_chart: ^1.0.0
  firebase_storage: ^13.0.0
  file_picker: ^10.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/